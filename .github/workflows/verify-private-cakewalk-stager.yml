name: Build and verify private Win95 Cakewalk stager
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/stage_private_cakewalk.py'
      - 'tools/verify_private_vm.py'
      - '.github/workflows/verify-private-cakewalk-stager.yml'
permissions:
  contents: read
jobs:
  test-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: FAT and 7z dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq p7zip-full
          python -m pip install --disable-pip-version-check pyfatfs==1.1.0 setuptools==80.9.0
      - name: Obtain existing Win95 installed test image privately
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private"
          curl --fail --location --retry 3 --max-time 240 'https://www.rekoba.de/~cs/v86/win95/Windows95b_p9x-0.9.91_512MB.img.7z' -o "$RUNNER_TEMP/private/source.7z"
          7z x -y "-o$RUNNER_TEMP/private" "$RUNNER_TEMP/private/source.7z" >/dev/null
          image="$(find "$RUNNER_TEMP/private" -iname '*.img' -size 512M -type f | head -1)"
          test -n "$image"
          echo "WIN95_IMG=$image" >> "$GITHUB_ENV"
      - name: Generate original synthetic test installer, never actual Cakewalk media
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'private'/'dummy-cakewalk.zip'
          with zipfile.ZipFile(path,'w',compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr('Test/SETUPCW9.EXE',b'MZ'+b'Wise'+b'x'*8000)
              z.writestr('Test/SETUPCW9.W02',b'a'*10000)
              z.writestr('Test/SETUPCW9.W03',b'b'*10000)
          PY
      - name: Create synthetic driver fixture for offline FAT testing
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'private'/'creative'
          folder.mkdir()
          names=('SB16AWE.INF','SBAWE.VXD','SBAWE32.DRV','AWEMAN.DLL','AWEMAN32.DLL',
           'SYNTHGM.SBK','SB16.VXD','SB16SND.DRV','SBFM.DRV','CSPMAN.DLL','CIFMAN.DLL',
           'CIFMAN.CRL','UIDLL16.DLL','WFM0200.ACV','WFM0200A.CSP','WFM0201.ACV',
           'WFM0201A.CSP','WFM0202.ACV','WFM0202A.CSP','WFM0203.ACV','WFM0203A.CSP')
          for name in names:(folder/name).write_bytes(b'SYNTHETIC-TEST-FIXTURE-DO-NOT-INSTALL')
          PY
      - name: Stage copied Windows disk and inspect correct files
        run: |
          set -euo pipefail
          python tools/stage_private_cakewalk.py stage --disk "$WIN95_IMG" \
            --cakewalk "$RUNNER_TEMP/private/dummy-cakewalk.zip" \
            --creative "$RUNNER_TEMP/private/creative" \
            --output "$RUNNER_TEMP/private/staged.img" \
            --report "$RUNNER_TEMP/private/staging.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from pyfatfs.PyFatFS import PyFatFS
          import sys
          sys.path.insert(0,'tools')
          from stage_private_cakewalk import fat_offset,GUEST_BOOT,STARTUP
          original=Path(os.environ['WIN95_IMG'])
          staged=Path(os.environ['RUNNER_TEMP'])/'private/staged.img'
          assert staged.stat().st_size==original.stat().st_size==536870912
          with PyFatFS(str(staged),offset=fat_offset(staged),read_only=True) as fs:
              assert fs.readbytes(STARTUP+'/125ACW9.BAT')==GUEST_BOOT
              assert fs.readbytes('AWEINST/SETUPCW9.EXE').startswith(b'MZWise')
              assert fs.readbytes('AWEINST/SETUPCW9.W02')==b'a'*10000
              assert fs.readbytes('WINDOWS/INF/SB16AWE.INF').startswith(b'SYNTHETIC-TEST')
              assert fs.readbytes('WINDOWS/SYSTEM/SBAWE.VXD').startswith(b'SYNTHETIC-TEST')
          with PyFatFS(str(original),offset=fat_offset(original),read_only=True) as fs:
              assert not fs.exists(STARTUP+'/125ACW9.BAT')
          print('PASS: Copy-on-write staging, 3 installer segments, Startup BAT, source unchanged.')
          print('NOT VERIFIED: actual Cakewalk installation or Creative driver binding.')
          PY
      - name: Adversarial postboot inspection (staging and fake EXIT must not pass)
        run: |
          python - <<'PY'
          import os,sys,json
          from pathlib import Path
          from pyfatfs.PyFatFS import PyFatFS
          sys.path.insert(0,'tools')
          from stage_private_cakewalk import fat_offset
          from verify_private_vm import inspect
          disk=Path(os.environ['RUNNER_TEMP'])/'private/staged.img'
          first=inspect(disk)
          assert first['cakewalk_installer_staged']
          assert not first['cakewalk_setup_attempted']
          assert not first['cakewalk_program_files_present']
          assert not first['inspection_pass']
          assert not first['ready_to_release']
          with PyFatFS(str(disk),offset=fat_offset(disk),read_only=False,preserve_case=False) as fs:
              with fs.openbin('AWEINST/CW9.TRIED','w') as f: f.write(b'ATTEMPT')
              with fs.openbin('AWEINST/CW9.EXIT','w') as f: f.write(b'RETURNED')
          second=inspect(disk)
          assert second['cakewalk_setup_attempted'] and second['cakewalk_setup_batch_returned']
          assert not second['cakewalk_program_files_present']
          assert not second['inspection_pass']
          with PyFatFS(str(disk),offset=fat_offset(disk),read_only=False,preserve_case=False) as fs:
              fs.makedirs('CWPATEST',recreate=True)
              with fs.openbin('CWPATEST/CWPA.EXE','w') as f:
                  f.write(b'MZ'+b'FAKE-PROGRAM-PLACEHOLDER'+b'X'*120000)
          third=inspect(disk)
          assert third['cakewalk_program_files_present']
          assert third['inspection_pass']
          assert not third['ready_to_release']
          assert not third['midi_output_verified']
          assert not third['cakewalk_executed_successfully']
          print('PASS: Staging is not installation; fake EXIT never passes.')
          print('PASS: Program-file inventory is independent of process/audio release proof.')
          PY
      - name: Always destroy proprietary test media and copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/private"
  build-windows-tool:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable staging tool, no media embedded
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyfatfs==1.1.0 pyinstaller==6.16.0 setuptools==80.9.0
          python -m PyInstaller --noconfirm --clean --onefile --name AWE95-Guest-Stage tools/stage_private_cakewalk.py
          python -m PyInstaller --noconfirm --clean --onefile --name AWE95-Guest-Verify --paths tools tools/verify_private_vm.py
          & '.\dist\AWE95-Guest-Verify.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Private verifier EXE failed basic launch test' }
          & '.\dist\AWE95-Guest-Stage.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Portable Windows tool failed basic launch test' }
      - uses: actions/upload-artifact@v4
        with:
          name: AWE95-Guest-Stage-Windows-x64
          path: |
            dist/AWE95-Guest-Stage.exe
            dist/AWE95-Guest-Verify.exe
          if-no-files-found: error
          retention-days: 14
