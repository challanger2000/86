name: Verify actual Win95 guest Startup execution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/prove_win95_autostart.py'
      - '.github/workflows/prove-win95-autostart.yml'
permissions:
  contents: read
jobs:
  win95-guest-autostart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and FAT tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 p7zip-full
          python -m pip install --disable-pip-version-check pyfatfs==1.1.0 setuptools==80.9.0
      - name: Download existing Windows95 OSR2 installed disk to private runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private"
          curl --fail --location --retry 3 --max-time 240 'https://www.rekoba.de/~cs/v86/win95/Windows95b_p9x-0.9.91_512MB.img.7z' -o "$RUNNER_TEMP/private/source.7z"
          7z x -y "-o$RUNNER_TEMP/private" "$RUNNER_TEMP/private/source.7z" >/dev/null
          image="$(find "$RUNNER_TEMP/private" -iname '*.img' -size 512M -type f | head -1)"
          test -n "$image"
          python tools/prove_win95_autostart.py --disk "$image" --report "$RUNNER_TEMP/private/guest-probe.json"
      - name: Destroy proprietary Windows disk; never publish it
        if: always()
        run: rm -rf "$RUNNER_TEMP/private"
